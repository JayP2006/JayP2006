name: Refresh Contribution Animation

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v4

      - name: Generate contribution snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: JayP2006
          outputs: |
            github-snake.svg?palette=github&color_snake=0891B2
            github-snake-dark.svg?palette=github-dark&color_snake=67E8F9

      - name: Commit refreshed SVGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution animation"
          file_pattern: "github-snake.svg github-snake-dark.svg"
